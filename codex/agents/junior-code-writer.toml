name = "junior-code-writer"
description = "Implements MECHANICAL batches only — literal, fully-specified changes requiring no architectural judgment, no pattern discovery, and no cross-file reasoning. Use only when task-planner has classified a batch as MECHANICAL. Refuses non-MECHANICAL batches and fix rounds. Limits file reads to 5. Tracks context budget and writes HANDOFF.md for senior code-writer if context exceeds 75% mid-batch."
